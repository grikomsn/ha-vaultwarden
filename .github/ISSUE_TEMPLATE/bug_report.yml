name: Bug report
description: Something in the Home Assistant app doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove secrets before posting: admin token, push installation key, tunnel token,
        Tailscale auth key, SMTP password and email addresses.
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.37.5"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware and Home Assistant OS version
      placeholder: Home Assistant Green, OS 17.0
    validations:
      required: true
  - type: checkboxes
    id: exposure
    attributes:
      label: How the vault is exposed
      options:
        - label: Built-in Cloudflare Tunnel
        - label: Built-in Tailscale Serve
        - label: Built-in Tailscale Funnel
        - label: Cloudflared app or another proxy
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: App log
      description: From the app's Log tab.
      render: text
